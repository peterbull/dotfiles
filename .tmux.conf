# enable mouse support
set -g mouse on

# vim mode
set-window-option -g mode-keys vi

# # Set the prefix to Ctrl-a (instead of Ctrl-b)
# set -g prefix C-a
# unbind C-b
# bind C-a send-prefix

# Start window numbering at 1
set -g base-index 1

# Start pane numbering at 1
setw -g pane-base-index 1

# renumber windows
set-option -g renumber-windows on

set -g default-command "reattach-to-user-namespace -l $SHELL"

# Improve colors
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",xterm-256color:Ms=\\E]52;c;%p2%s\\7"

# Enable italic support
set -as terminal-overrides ',*:sitm=\E[3m'

# Enable bold support
set -as terminal-overrides ',*:bold=\E[1m'

# Ensure undercurl support
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'

# Set scrollback buffer to 10000
set -g history-limit 10000

# Faster escape so Neovim doesn't lag
set -sg escape-time 10

# Customize the status line
set -g status-fg  green
set -g status-bg  black

# image.nvim needs this:
set -gq allow-passthrough on
set -g visual-activity off

# Reload config file
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Switch panes using vim keys with prefix
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Copy / Scroll mode (vim-style) ──────────────────────────────────────────
# Enter copy mode with prefix + Escape (scroll through output like vim normal mode)
bind Escape copy-mode

# Navigation
bind -T copy-mode-vi h send -X cursor-left
bind -T copy-mode-vi j send -X cursor-down
bind -T copy-mode-vi k send -X cursor-up
bind -T copy-mode-vi l send -X cursor-right
bind -T copy-mode-vi u send -X halfpage-up
bind -T copy-mode-vi d send -X halfpage-down
bind -T copy-mode-vi g send -X history-top
bind -T copy-mode-vi G send -X history-bottom

# Selection & yank
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Exit copy mode
bind -T copy-mode-vi Escape send -X cancel
# ────────────────────────────────────────────────────────────────────────────

# Set color conf for lazyvim
set-option -a terminal-features 'xterm-256color:RGB'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'Morantron/tmux-fingers'

set -ag terminal-overrides ",xterm-256color:Ms=\\E]52;c;%p2%s\\7"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

bind-key -n M-c run -b "#{@fingers-cli} start #{pane_id}"
